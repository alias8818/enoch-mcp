[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enoch-mcp"
version = "0.1.3"
description = "MCP server for the Enoch FastAPI control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Enoch contributors" }]
keywords = ["enoch", "mcp", "model-context-protocol", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.23",
  "pydantic>=2",
]

[project.scripts]
enoch-mcp = "enoch_mcp.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enoch_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.urls]
Homepage = "https://github.com/alias8818/enoch-mcp"
Repository = "https://github.com/alias8818/enoch-mcp"
Issues = "https://github.com/alias8818/enoch-mcp/issues"

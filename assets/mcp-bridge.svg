<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">enoch-mcp bridge</title><desc id="desc">Public-safe diagram showing MCP clients connecting through enoch-mcp to a configured Enoch API.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.title{font:800 34px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#edf3ff}.small{font:600 17px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#b8c3d9}.tiny{font:600 13px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#93a4c2}.box{fill:rgba(15,23,42,.82);stroke:#334155;stroke-width:1.5}.accent{stroke:url(#a);stroke-width:4;fill:none;marker-end:url(#arrow)}.pill{fill:#0f172a;stroke:#475569}.num{font:900 28px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#7dd3fc}.muted{fill:#93a4c2;font:500 14px ui-sans-serif,system-ui,Segoe UI,sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker></defs><rect width="1100" height="360" rx="26" fill="url(#bg)"/><text x="52" y="62" class="title">MCP clients talk to Enoch through a thin, typed bridge</text><g transform="translate(75 135)"><rect class="box" width="220" height="110" rx="18"/><text class="small" x="20" y="42">MCP client</text><text class="tiny" x="20" y="74">Claude / Cursor / IDE</text></g><path class="accent" d="M310 190 H390"/><g transform="translate(405 115)"><rect class="box" width="245" height="150" rx="18"/><text class="small" x="20" y="42">enoch-mcp</text><text class="tiny" x="20" y="74">stdio server</text><text class="tiny" x="20" y="96">read-only annotations</text><text class="tiny" x="20" y="118">bounded diagnostics</text></g><path class="accent" d="M665 190 H745"/><g transform="translate(760 135)"><rect class="box" width="250" height="110" rx="18"/><text class="small" x="20" y="42">Configured Enoch API</text><text class="tiny" x="20" y="74">local or private deployment</text></g></svg>
